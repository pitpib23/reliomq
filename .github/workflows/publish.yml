name: Publish to PyPI

# Fires when a GitHub Release is published (draft/pre-release edits do not
# trigger this). Tag pushes alone do NOT trigger it -- create a Release from
# the tag to publish.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment name entered when registering the trusted
    # publisher on pypi.org (or remove this block if you register without one).
    environment: pypi
    permissions:
      id-token: write  # required for PyPI's OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
