[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliomq"
version = "0.1.0"
description = "Durable, application-acknowledged MQTT publishing and forwarding"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "paho-mqtt>=2.0,<3.0",
]

[tool.setuptools]
packages = ["reliomq"]

